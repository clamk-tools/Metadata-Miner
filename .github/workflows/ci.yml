name: CI

# Every push and pull request: the Python tests, lint, type check, unit tests, build, and the end-to-end tests of the
# built site in three browsers. On main, what was tested is then published to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No personal email, private local path or secret in what is published (.githooks/check-privacy.sh).
  # The commits of the push or pull request are checked, and every tracked file as it is now.
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commits and files
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE..$GITHUB_SHA"
          elif [ "$EVENT" = "push" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          fi
          if [ -n "$range" ]; then sh .githooks/check-privacy.sh $range; fi
          sh .githooks/check-privacy.sh --tree

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Python minor version of the Pyodide release the site loads (package.json: pyodide 314.x = Python 3.14),
      # so the tests run on the engine that ships.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: [test, privacy-guard]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
