name: CI

# Every push and pull request: the Python tests, lint, type check, unit tests, build, and the end-to-end tests of the
# built site in three browsers, side by side. On main, what was tested is then published to GitHub Pages.
# Each action is fixed to one commit (its version in the comment), not to a tag that can be moved: what builds the
# published site cannot change without a change here. Dependabot proposes the updates (.github/dependabot.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No personal email, private local path or secret in what is published (.githooks/check-privacy.sh).
  # The commits of the push or pull request are checked, and every tracked file as it is now.
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check commits and files
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE..$GITHUB_SHA"
          elif [ "$EVENT" = "push" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          fi
          if [ -n "$range" ]; then sh .githooks/check-privacy.sh $range; fi
          sh .githooks/check-privacy.sh --tree

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The Python minor version of the Pyodide release the site loads (package.json: pyodide 314.x = Python 3.14),
      # so the tests run on the engine that ships.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The site that was built, handed to the end-to-end jobs below: they test this very dist/, which is the one
      # published.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  # The end-to-end tests of the built site, one job per browser, side by side rather than one after another. The
  # browsers Playwright downloads are kept between runs (until package-lock.json changes); only the system
  # packages they need are installed each time.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # a failure in one browser still lets the others tell their result
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: dist

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps "$BROWSER"
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps "$BROWSER"

      - run: npm run e2e -- --project="$BROWSER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    needs: [test, e2e, privacy-guard]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
